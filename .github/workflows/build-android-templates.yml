name: Build Godot Android templates (encrypted)

# Put this file in your repo at: .github/workflows/build-android-templates.yml
# Needs a repository secret named GODOT_KEY (64 hex characters).
# Run it from the Actions tab > "Build Godot Android templates" > Run workflow.
# When it finishes, download the "android-templates" artifact (zip) and
# select android_debug.apk / android_release.apk as the Custom Template in your preset.

on:
  workflow_dispatch:

env:
  GODOT_TAG: 4.7.2-stable          # must match your editor: 4.7.2.stable
  SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.GODOT_KEY }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check the key
        run: |
          if ! echo "$SCRIPT_AES256_ENCRYPTION_KEY" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "GODOT_KEY secret is missing or is not 64 hex characters"; exit 1
          fi

      - name: Get Godot source
        run: git clone --depth 1 --branch "$GODOT_TAG" https://github.com/godotengine/godot.git .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install scons
        run: pip install scons

      - name: Install the NDK version this Godot expects
        run: |
          NDK=$(grep -rhoE 'ndk_version[^=]*=\s*"[0-9.]+"|return "[0-9]+\.[0-9]+\.[0-9]+"' platform/android/*.py | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          echo "NDK: $NDK"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK" >> "$GITHUB_ENV"

      - name: Build debug library (arm64)
        run: scons platform=android target=template_debug arch=arm64 -j4

      - name: Build release library (arm64)
        run: scons platform=android target=template_release arch=arm64 -j4

      - name: Package the template APKs
        run: |
          cd platform/android/java
          ./gradlew generateGodotTemplates

      - uses: actions/upload-artifact@v4
        with:
          name: android-templates
          path: |
            bin/android_debug.apk
            bin/android_release.apk
