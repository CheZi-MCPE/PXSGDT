name: Build Godot Windows templates (encrypted)

# Put this file in your repo at: .github/workflows/build-windows-templates.yml
# Needs a repository secret named GODOT_KEY (64 hex characters), same as the others.
# Run it from the Actions tab > "Build Godot Windows templates" > Run workflow.
# When it finishes, download the "windows-templates" artifact (zip) and set
# Custom Template > Debug / Release in your Windows export preset to the two .exe files.

on:
  workflow_dispatch:

env:
  GODOT_TAG: 4.7.2-stable          # must match your editor: 4.7.2.stable
  SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.GODOT_KEY }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check the key
        shell: bash
        run: |
          if ! echo "$SCRIPT_AES256_ENCRYPTION_KEY" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "GODOT_KEY secret is missing or is not 64 hex characters"; exit 1
          fi

      - name: Get Godot source
        shell: bash
        run: git clone --depth 1 --branch "$GODOT_TAG" https://github.com/godotengine/godot.git .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scons
        run: pip install scons

      - name: Build debug template (x86_64)
        run: scons platform=windows target=template_debug arch=x86_64 -j4

      - name: Build release template (x86_64)
        run: scons platform=windows target=template_release arch=x86_64 -j4

      - uses: actions/upload-artifact@v4
        with:
          name: windows-templates
          path: |
            bin/godot.windows.template_debug.x86_64.exe
            bin/godot.windows.template_debug.x86_64.console.exe
            bin/godot.windows.template_release.x86_64.exe
            bin/godot.windows.template_release.x86_64.console.exe
